<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="공문 도우미">
  <!-- 공문 도우미 아이콘
       종이(공문) 위에 파란 체크 — '검사해서 바로잡아 준다'는 뜻.
       오른쪽 위를 접어 문서임이 작은 크기에서도 읽히게 했다.
       제작 · 평택교육지원청 장학사 강주원 -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8eef8"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>

  <!-- 바탕 -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>

  <!-- 종이 (오른쪽 위 모서리를 접었다) -->
  <path d="M34 26h44l20 20v56a6 6 0 0 1-6 6H34a6 6 0 0 1-6-6V32a6 6 0 0 1 6-6z"
        fill="url(#paper)"/>
  <path d="M78 26l20 20H84a6 6 0 0 1-6-6V26z" fill="#b8c7de"/>

  <!-- 본문 줄 -->
  <g fill="#9fb2cd">
    <rect x="40" y="56" width="38" height="6" rx="3"/>
    <rect x="40" y="70" width="46" height="6" rx="3"/>
    <rect x="40" y="84" width="28" height="6" rx="3"/>
  </g>

  <!-- 체크 -->
  <circle cx="90" cy="88" r="25" fill="url(#mark)" stroke="#ffffff" stroke-width="6"/>
  <path d="M79 88l8 8 15-16" fill="none" stroke="#ffffff"
        stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
